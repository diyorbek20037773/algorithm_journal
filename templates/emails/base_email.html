<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;
               padding:0;
               background:#f6f7f9;
               font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
               color:#111827">
    <table role="presentation"
           width="100%"
           cellpadding="0"
           cellspacing="0"
           style="background:#f6f7f9;
                  padding:24px 0">
      <tr>
        <td align="center">
          <table role="presentation"
                 width="600"
                 cellpadding="0"
                 cellspacing="0"
                 style="width:600px;
                        max-width:100%;
                        background:#ffffff;
                        border:1px solid #e5e7eb;
                        border-radius:10px">
            <tr>
              <td style="padding:24px 32px;border-bottom:1px solid #e5e7eb;">
                <div style="font-family:Georgia,serif;
                            font-weight:700;
                            font-size:18px;
                            letter-spacing:0.02em">{{ site_settings.journal_name }}</div>
                <div style="height:2px;width:48px;background:#0f4c81;margin:6px 0;"></div>
                <div style="font-size:10px;
                            letter-spacing:0.12em;
                            text-transform:uppercase;
                            color:#4b5563">{{ site_settings.journal_subtitle|default:"Review of Economic Research" }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px;font-size:15px;line-height:1.6;">{{ body_html|safe }}</td>
            </tr>
            <tr>
              <td style="padding:18px 32px;
                         border-top:1px solid #e5e7eb;
                         font-size:12px;
                         color:#4b5563">
                {{ site_settings.publisher_name }} ·
                <a href="mailto:{{ site_settings.contact_email }}" style="color:#0f4c81">{{ site_settings.contact_email }}</a>
                <br>
                <a href="{{ site_url }}" style="color:#0f4c81;">{{ site_url }}</a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

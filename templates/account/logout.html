{% extends "account/base.html" %}
{% load i18n %}

{% block title %}{% translate "Sign out" %} · {{ site_settings.journal_name }}{% endblock %}

{% block auth_content %}
  <h1 class="text-2xl mb-4">{% translate "Sign out" %}</h1>
  <p class="muted mb-6">{% translate "Are you sure you want to sign out?" %}</p>
  <form method="post" action="{% url 'account_logout' %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-primary w-full">{% translate "Sign out" %}</button>
  </form>
{% endblock %}

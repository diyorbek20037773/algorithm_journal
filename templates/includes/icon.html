{% comment %}
  Inline line icons (stroke, 24-unit grid). Usage:
    {% include "includes/icon.html" with name="search" size=18 %}
  Icons are decorative; the surrounding control carries the accessible name.
{% endcomment %}
<svg width="{{ size|default:16 }}"
     height="{{ size|default:16 }}"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round"
     aria-hidden="true"
     focusable="false"
     class="{{ class|default:'shrink-0' }}">
  {% if name == "search" %}
    <circle cx="11" cy="11" r="8"></circle>
    <path d="m21 21-4.3-4.3"></path>
  {% elif name == "upload" %}
    <path d="M12 3v12"></path>
    <path d="m7 8 5-5 5 5"></path>
    <path d="M4 21h16"></path>
  {% elif name == "pdf" %}
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <path d="M14 2v6h6"></path>
    <path d="M9 15h6"></path>
    <path d="M9 11h2"></path>
  {% elif name == "download" %}
    <path d="M12 3v12"></path>
    <path d="m7 10 5 5 5-5"></path>
    <path d="M4 21h16"></path>
  {% elif name == "arrow" %}
    <path d="M5 12h14"></path>
    <path d="m13 6 6 6-6 6"></path>
  {% elif name == "verified" %}
    <path d="M12 2 15 5l4 .5.5 4 3 3-3 3-.5 4-4 .5-3 3-3-3-4-.5-.5-4-3-3 3-3 .5-4 4-.5z"></path>
    <path d="m9 12 2 2 4-4"></path>
  {% elif name == "unlock" %}
    <rect x="3" y="11" width="18" height="11" rx="2"></rect>
    <path d="M7 11V7a5 5 0 0 1 9.9-1"></path>
  {% elif name == "eye" %}
    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
    <circle cx="12" cy="12" r="3"></circle>
  {% elif name == "eye-off" %}
    <path d="M9.9 4.2A10.9 10.9 0 0 1 12 4c6.5 0 10 8 10 8a18 18 0 0 1-2.2 3.2"></path>
    <path d="M6.6 6.6A18 18 0 0 0 2 12s3.5 8 10 8a10.9 10.9 0 0 0 5.4-1.4"></path>
    <path d="m2 2 20 20"></path>
    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
  {% elif name == "quote" %}
    <path d="M3 21c3 0 7-1 7-8V5H4v6h3c0 4-1 5-4 5v5z"></path>
    <path d="M14 21c3 0 7-1 7-8V5h-6v6h3c0 4-1 5-4 5v5z"></path>
  {% elif name == "book" %}
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
  {% elif name == "check" %}
    <path d="M20 6 9 17l-5-5"></path>
  {% elif name == "check-circle" %}
    <circle cx="12" cy="12" r="10"></circle>
    <path d="m9 12 2 2 4-4"></path>
  {% elif name == "code" %}
    <path d="m16 18 6-6-6-6"></path>
    <path d="m8 6-6 6 6 6"></path>
  {% elif name == "file" %}
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
    <path d="M14 2v6h6"></path>
  {% elif name == "folder" %}
    <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.2 3.9A2 2 0 0 0 7.5 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"></path>
  {% elif name == "mail" %}
    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
    <path d="m22 7-10 6L2 7"></path>
  {% elif name == "pin" %}
    <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"></path>
    <circle cx="12" cy="10" r="3"></circle>
  {% elif name == "share" %}
    <circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle>
    <path d="m8.6 13.5 6.8 4"></path>
    <path d="m15.4 6.5-6.8 4"></path>
  {% elif name == "award" %}
    <circle cx="12" cy="8" r="6"></circle>
    <path d="M15.5 13 17 22l-5-3-5 3 1.5-9"></path>
  {% elif name == "shield" %}
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
    <path d="m9 12 2 2 4-4"></path>
  {% elif name == "database" %}
    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
    <path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"></path>
    <path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"></path>
  {% elif name == "chevron-left" %}
    <path d="m15 18-6-6 6-6"></path>
  {% elif name == "chevron-right" %}
    <path d="m9 18 6-6-6-6"></path>
  {% elif name == "menu" %}
    <path d="M3 6h18M3 12h18M3 18h18"></path>
  {% elif name == "x" %}
    <path d="M18 6 6 18"></path>
    <path d="m6 6 12 12"></path>
  {% elif name == "clock" %}
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M12 6v6l4 2"></path>
  {% elif name == "globe" %}
    <circle cx="12" cy="12" r="10"></circle>
    <path d="M2 12h20"></path>
    <path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"></path>
  {% elif name == "bell" %}
    <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
    <path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path>
  {% elif name == "user" %}
    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
    <circle cx="12" cy="7" r="4"></circle>
    {# --- editorial console --- #}
  {% elif name == "grid" %}
    <rect x="3" y="3" width="7" height="7" rx="1"></rect>
    <rect x="14" y="3" width="7" height="7" rx="1"></rect>
    <rect x="3" y="14" width="7" height="7" rx="1"></rect>
    <rect x="14" y="14" width="7" height="7" rx="1"></rect>
  {% elif name == "inbox" %}
    <path d="M3 12h5l2 3h4l2-3h5"></path>
    <path d="M5 5h14l2 7v7H3v-7z"></path>
  {% elif name == "layers" %}
    <path d="m12 3 9 5-9 5-9-5z"></path>
    <path d="m3 14 9 5 9-5"></path>
  {% elif name == "chart" %}
    <path d="M3 21h18"></path>
    <path d="M7 21V10"></path>
    <path d="M12 21V4"></path>
    <path d="M17 21v-7"></path>
  {% elif name == "settings" %}
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z">
    </path>
  {% elif name == "key" %}
    <circle cx="7.5" cy="15.5" r="4.5"></circle>
    <path d="m10.7 12.3 9.3-9.3"></path>
    <path d="m17 6 3 3"></path>
  {% elif name == "logout" %}
    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
    <path d="m16 17 5-5-5-5"></path>
    <path d="M21 12H9"></path>
  {% elif name == "plus" %}
    <path d="M12 5v14"></path>
    <path d="M5 12h14"></path>
  {% elif name == "alert" %}
    <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>
    <path d="M12 9v4"></path>
    <path d="M12 17h.01"></path>
  {% elif name == "users" %}
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
    <circle cx="9" cy="7" r="4"></circle>
    <path d="M22 21v-2a4 4 0 0 0-3-3.9"></path>
    <path d="M16 3.1a4 4 0 0 1 0 7.8"></path>
  {% elif name == "edit" %}
    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
    <path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"></path>
  {% endif %}
</svg>

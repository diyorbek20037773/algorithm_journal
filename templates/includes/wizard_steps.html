{% load i18n %}
<ol class="flex flex-wrap gap-2 mb-8" aria-label="{% translate 'Submission steps' %}">
  {% for number, label in steps %}
    <li class="flex items-center gap-2">
      <span class="chip {% if number == current_step %}chip-jel{% elif number < current_step %}chip{% endif %}"
            {% if number == current_step %}aria-current="step"{% endif %}>
        <span class="meta">{{ number }}</span> {{ label }}
      </span>
      {% if not forloop.last %}<span class="subtle" aria-hidden="true">→</span>{% endif %}
    </li>
  {% endfor %}
</ol>

# SonarQube / SonarCloud analysis (CI job "sonarqube").
# SonarCloud: set sonar.organization; self-hosted SonarQube: set the
# SONAR_HOST_URL repository variable and delete the organization line.
sonar.projectKey=diyorbek20037773_algorithm_journal
sonar.organization=diyorbek20037773
sonar.projectName=MEZON: Review of Economic Research

sonar.sources=apps,config,scripts,templates
sonar.tests=tests
sonar.exclusions=**/migrations/**,**/__pycache__/**,static/vendor/**,static/js/*.min.js,scripts/i18n_catalogue_*.py
sonar.test.inclusions=tests/**
sonar.sourceEncoding=UTF-8

sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

# Seed data and translation catalogues are data, not logic.
sonar.cpd.exclusions=apps/**/management/commands/seed_*.py,seed/**,scripts/i18n_catalogue_*.py

[project]
name = "algorithm-journal"
version = "1.0.0"
description = "ALGORITHM: Review of Economic Research (ARER) — open-access scholarly journal platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "ARER Engineering" }]

dependencies = [
    # Core
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "django-environ>=0.11",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    # Async
    "celery>=5.4",
    "redis>=5.0",
    "django-celery-beat>=2.7",
    "django-celery-results>=2.5",
    # Frontend
    "django-tailwind-cli>=4.0",
    "django-htmx>=1.19",
    "django-widget-tweaks>=1.5",
    # i18n
    "django-modeltranslation>=0.19",
    # Auth
    "django-allauth>=65.0",
    "django-otp>=1.5",
    "qrcode>=8.0",
    "argon2-cffi>=23.1",
    "django-axes>=7.0",
    # Content
    "markdown-it-py>=3.0",
    "nh3>=0.2",
    "Pillow>=11.0",
    "django-countries>=7.6",
    "python-slugify>=8.0",
    # Files / documents
    "pypdf>=5.0",
    "pikepdf>=9.0",
    "reportlab>=4.2",
    "python-docx>=1.1",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    # Citations
    "citeproc-py>=0.8",
    "citeproc-py-styles>=0.1.3",
    # Crossref / XML
    "lxml>=5.3",
    "requests>=2.32",
    # API
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "django-filter>=24.3",
    # Email
    "django-anymail[resend]>=11.0",
    # Security
    "django-csp>=3.8",
    "django-ratelimit>=4.1",
    "django-auditlog>=3.0",
    # i18n tooling
    "polib>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "factory-boy>=3.3",
    "faker>=30.0",
    "playwright>=1.48",
    "pytest-playwright>=0.5",
    "ruff>=0.7",
    "djlint>=1.35",
    "mypy>=1.13",
    "django-stubs>=5.1",
    "pre-commit>=4.0",
    "bibtexparser>=1.4",
    "rispy>=0.9",
    "django-debug-toolbar>=4.4",
    "xmlschema>=3.4",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv", "node_modules", "design"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "DJ", "SIM", "RUF"]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # function call in default arg (Django idiom)
    "RUF012",  # mutable class attrs need ClassVar (noisy for Django)
    "DJ001",   # null=True on CharField (needed for translated/optional fields)
    "SIM105",  # contextlib.suppress
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "I001", "RUF"]
"config/settings/*" = ["F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.djlint]
profile = "django"
extension = "html"
indent = 2
max_line_length = 200
ignore = "H006,H013,H021,H023,H030,H031,T003,H037,D018,H008,H011,H012,H016,H025,T002,H017"
exclude = ".venv,node_modules,design,docs"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]
addopts = "--reuse-db --strict-markers -p no:randomly"
markers = [
    "e2e: end-to-end Playwright tests (require a running server)",
    "slow: slow tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
exclude = ["migrations", ".venv", "design"]
plugins = ["mypy_django_plugin.main"]

[tool.mypy_django_plugin]
django_settings_module = "config.settings.dev"

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*", "*/__init__.py"]

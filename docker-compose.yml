# Development stack for ALGORITHM: Review of Economic Research
# Usage:  cp .env.example .env && docker compose up --build
name: arer

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arer}
      POSTGRES_USER: ${POSTGRES_USER:-arer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arer_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arer} -d ${POSTGRES_DB:-arer}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # SMTP

  web:
    build:
      context: .
      target: runtime
    command: ["web"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      DATABASE_URL: postgres://${POSTGRES_USER:-arer}:${POSTGRES_PASSWORD:-arer_dev_password}@db:5432/${POSTGRES_DB:-arer}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    volumes:
      - .:/app
      - media:/app/media
      - tailwind:/app/.tailwind
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  tailwind:
    build:
      context: .
      target: runtime
    command: ["tailwind"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-arer}:${POSTGRES_PASSWORD:-arer_dev_password}@db:5432/${POSTGRES_DB:-arer}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - tailwind:/app/.tailwind
    depends_on:
      - web

  worker:
    build:
      context: .
      target: runtime
    command: ["worker"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-arer}:${POSTGRES_PASSWORD:-arer_dev_password}@db:5432/${POSTGRES_DB:-arer}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      target: runtime
    command: ["beat"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://${POSTGRES_USER:-arer}:${POSTGRES_PASSWORD:-arer_dev_password}@db:5432/${POSTGRES_DB:-arer}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Optional self-hosted analytics: docker compose --profile analytics up
  matomo-db:
    image: mariadb:11
    profiles: ["analytics"]
    environment:
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      MARIADB_PASSWORD: matomo
      MARIADB_ROOT_PASSWORD: matomo_root
    volumes:
      - matomodb:/var/lib/mysql

  matomo:
    image: matomo:5-apache
    profiles: ["analytics"]
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo
      MATOMO_DATABASE_DBNAME: matomo
    volumes:
      - matomo:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - matomo-db

volumes:
  pgdata:
  redisdata:
  media:
  tailwind:
  matomodb:
  matomo:

# Exactly one scheduler: two beats would send every periodic task twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arer-beat
  labels:
    app.kubernetes.io/component: beat
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: arer
      app.kubernetes.io/component: beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arer
        app.kubernetes.io/component: beat
    spec:
      serviceAccountName: arer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          image: arer-web
          args: ["beat"]
          envFrom:
            - configMapRef:
                name: arer-config
            - secretRef:
                name: arer-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: arer-beat
          resources:
            requests:
              cpu: 20m
              memory: 192Mi
            limits:
              cpu: 250m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

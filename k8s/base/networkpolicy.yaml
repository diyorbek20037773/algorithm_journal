# Default-deny ingress for the namespace, then open exactly what is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arer-web-from-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arer
      app.kubernetes.io/component: web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arer-data-from-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: arer
      app.kubernetes.io/tier: data
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: arer
      ports:
        - port: 5432
        - port: 6379

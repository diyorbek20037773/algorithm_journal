apiVersion: apps/v1
kind: Deployment
metadata:
  name: arer-worker
  labels:
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: arer
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arer
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: arer
      automountServiceAccountToken: false
      # Celery finishes the task in hand on SIGTERM (warm shutdown).
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: arer-web
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: arer-config
            - secretRef:
                name: arer-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: arer-worker
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            exec:
              command: ["sh", "-c", "celery -A config inspect ping -d celery@$HOSTNAME -t 10"]
            initialDelaySeconds: 60
            periodSeconds: 120
            timeoutSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: arer-media
        - name: tmp
          emptyDir: {}

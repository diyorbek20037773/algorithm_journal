apiVersion: apps/v1
kind: Deployment
metadata:
  name: arer-web
  labels:
    app.kubernetes.io/component: web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: arer
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arer
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: arer
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: arer-web
          args: ["prod"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: arer-config
            - secretRef:
                name: arer-secrets
          env:
            - name: OTEL_SERVICE_NAME
              value: arer-web
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /livez/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /livez/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the ingress drop the endpoint before gunicorn stops.
              exec:
                command: ["sleep", "5"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: media
              mountPath: /app/media
            - name: tmp
              mountPath: /tmp
        # Serves /media/ from the shared volume, the job Caddy does in
        # docker-compose.prod.yml; gunicorn never streams user uploads.
        - name: media
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: media
              containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: media
            periodSeconds: 10
          securityContext:
            # The image owns /var/cache/nginx as uid 101; uploads are world-readable.
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: media
              mountPath: /usr/share/nginx/html/media
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: arer-media
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: arer-media-nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arer-media-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_tokens off;
      location /media/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff";
      }
      location / { return 404; }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: arer-web
  labels:
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: arer
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: media
      port: 8080
      targetPort: media

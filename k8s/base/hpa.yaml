apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arer-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arer-web
  minReplicas: 2
  # Each replica opens up to GUNICORN_WORKERS × DB_POOL_MAX connections;
  # keep maxReplicas × 12 under Postgres max_connections (200).
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: arer-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: arer-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80

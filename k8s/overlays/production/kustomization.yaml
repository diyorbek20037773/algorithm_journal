# Production: https://algorithm-journal.uz on the cluster in Uzbekistan.
# CI sets images[0].newTag here when a release tag (v*) is pushed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: arer

resources:
  - namespace.yaml
  - ../../base

components:
  - ../../components/data

labels:
  - pairs:
      app.kubernetes.io/instance: arer-production
    includeSelectors: false

images:
  - name: arer-web
    newName: ghcr.io/diyorbek20037773/algorithm_journal
    newTag: latest

patches:
  - target:
      kind: ConfigMap
      name: arer-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: production
      - op: replace
        path: /data/DJANGO_ALLOWED_HOSTS
        value: "algorithm-journal.uz,www.algorithm-journal.uz,localhost"
      - op: replace
        path: /data/DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://algorithm-journal.uz,https://www.algorithm-journal.uz"
      - op: replace
        path: /data/SITE_DOMAIN
        value: algorithm-journal.uz
  - target:
      kind: Ingress
      name: arer
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value: ["algorithm-journal.uz", "www.algorithm-journal.uz"]
      - op: replace
        path: /spec/rules/0/host
        value: algorithm-journal.uz

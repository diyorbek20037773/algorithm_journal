# Cache and Celery broker.  Losing it loses queued tasks only; the site keeps
# serving uncached pages (DECISIONS #40), so no persistence volume.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arer-redis
  labels:
    app.kubernetes.io/component: redis
    app.kubernetes.io/tier: data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: arer
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arer
        app.kubernetes.io/component: redis
        app.kubernetes.io/tier: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "384mb",
                 "--maxmemory-policy", "volatile-lru", "--loglevel", "warning"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: arer-redis
  labels:
    app.kubernetes.io/component: redis
spec:
  selector:
    app.kubernetes.io/name: arer
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis

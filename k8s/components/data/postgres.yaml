apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: arer-postgres
  labels:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/tier: data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  serviceName: arer-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arer
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arer
        app.kubernetes.io/component: postgres
        app.kubernetes.io/tier: data
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - -c
            - max_connections=200
            - -c
            - shared_buffers=1GB
            - -c
            - effective_cache_size=3GB
            - -c
            - work_mem=8MB
            - -c
            - random_page_cost=1.1
            # Connection and DDL events for the audit trail (stdout -> Fluent Bit).
            - -c
            - log_connections=on
            - -c
            - log_disconnections=on
            - -c
            - log_statement=ddl
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: arer
            - name: POSTGRES_USER
              value: arer
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arer-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "arer", "-d", "arer"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "arer", "-d", "arer"]
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: arer-postgres
  labels:
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/name: arer
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

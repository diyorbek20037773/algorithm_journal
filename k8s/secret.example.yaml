# TEMPLATE ONLY — never commit real values.  Create the Secret out of band:
#
#   kubectl -n arer create secret generic arer-secrets \
#     --from-literal=DJANGO_SECRET_KEY="$(python -c 'import secrets;print(secrets.token_urlsafe(64))')" \
#     --from-literal=POSTGRES_PASSWORD="<strong-password>" \
#     --from-literal=DATABASE_URL="postgres://arer:<strong-password>@arer-postgres:5432/arer" \
#     --from-literal=IP_HASH_SALT="$(python -c 'import secrets;print(secrets.token_urlsafe(32))')"
#
# or keep it in Git encrypted with Sealed Secrets / SOPS (docs/PIPELINE_uz.md).
# Every other key from .env.example that holds a credential belongs here too.
apiVersion: v1
kind: Secret
metadata:
  name: arer-secrets
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "change-me"
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgres://arer:change-me@arer-postgres:5432/arer"
  IP_HASH_SALT: "change-me"
  RESEND_API_KEY: ""
  CROSSREF_USER: ""
  CROSSREF_PASSWORD: ""
  ORCID_CLIENT_ID: ""
  ORCID_CLIENT_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

# Node-level log shipper.  Container stdout (the app's JSON lines) is parsed,
# enriched with pod metadata and indexed as arer-logs-YYYY.MM.DD.  Lines from
# the `arer.audit` logger are re-tagged into arer-audit-*, and the Kubernetes
# API audit log (k8s/cluster-audit) into k8s-audit-*, so audit data can be
# retained longer and access-controlled separately.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Exclude_Path      /var/log/containers/fluent-bit-*.log
        multiline.parser  cri, docker
        DB                /var/fluent-bit/state/containers.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [INPUT]
        Name              tail
        Tag               k8s-audit
        Path              /var/log/kubernetes/audit/*.log
        Parser            json
        DB                /var/fluent-bit/state/k8s-audit.db
        Mem_Buf_Limit     20MB
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On
        Labels              On
        Annotations         Off

    # Application audit events get their own tag (and index).
    [FILTER]
        Name    rewrite_tag
        Match   kube.*
        Rule    $logger ^arer\.audit$ audit.app false

    [OUTPUT]
        Name                es
        Match               kube.*
        Host                elasticsearch
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     arer-logs
        Suppress_Type_Name  On
        Replace_Dots        On
        Retry_Limit         5

    [OUTPUT]
        Name                es
        Match               audit.*
        Host                elasticsearch
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     arer-audit
        Suppress_Type_Name  On
        Replace_Dots        On
        Retry_Limit         False

    [OUTPUT]
        Name                es
        Match               k8s-audit
        Host                elasticsearch
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     k8s-audit
        Suppress_Type_Name  On
        Replace_Dots        On
        Retry_Limit         False
  parsers.conf: |
    [PARSER]
        Name        json
        Format      json
        Time_Key    requestReceivedTimestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%LZ
        Time_Keep   On
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/component: fluent-bit
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/component: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        - operator: Exists
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.2.2
          ports:
            - name: http
              containerPort: 2020
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/fluent-bit/state
      volumes:
        - name: config
          configMap:
            name: fluent-bit
        - name: varlog
          hostPath:
            path: /var/log
        - name: state
          hostPath:
            path: /var/lib/fluent-bit
            type: DirectoryOrCreate

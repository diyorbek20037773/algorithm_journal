# Index retention: application logs and traces 14 days, audit indices 365 days.
# A plain CronJob instead of ILM policies keeps the rule readable in Git.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: es-retention
  labels:
    app.kubernetes.io/component: es-retention
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/component: es-retention
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
          containers:
            - name: curator
              image: curlimages/curl:8.11.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  es=http://elasticsearch:9200
                  prune() {
                    prefix="$1"; days="$2"
                    cutoff="$(date -u -d "@$(( $(date +%s) - days * 86400 ))" +%Y%m%d)"
                    curl -fsS "$es/_cat/indices/${prefix}-*?h=index" | while read -r idx; do
                      day="$(echo "$idx" | grep -oE '[0-9]{4}[.-][0-9]{2}[.-][0-9]{2}$' | tr -d .-)" || continue
                      if [ -n "$day" ] && [ "$day" -lt "$cutoff" ]; then
                        echo "delete $idx"; curl -fsS -X DELETE "$es/$idx" >/dev/null
                      fi
                    done
                  }
                  prune arer-logs 14
                  prune jaeger 14
                  prune arer-audit 365
                  prune k8s-audit 365
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
